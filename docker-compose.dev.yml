version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: quran-app-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: myapp_user
      POSTGRES_PASSWORD: myapp_password
      POSTGRES_DB: myapp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - quran-app-network-dev

  redis:
    image: redis:7-alpine
    container_name: quran-app-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    networks:
      - quran-app-network-dev

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: quran-app-backend-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      DB_HOST: postgres
      DB_USER: myapp_user
      DB_PASSWORD: myapp_password
      DB_NAME: myapp_db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    depends_on:
      - postgres
      - redis
    networks:
      - quran-app-network-dev
    command: npm run dev

  adminer:
    image: adminer:latest
    container_name: quran-app-adminer-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - quran-app-network-dev

volumes:
  postgres_data_dev:
  redis_data_dev:

networks:
  quran-app-network-dev:
    driver: bridge
